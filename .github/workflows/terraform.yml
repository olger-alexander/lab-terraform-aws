name: Terraform - dev

on:
  pull_request:
    paths: ["envs/dev/**", "modules/**"]
  push:
    branches: [main]
    paths: ["envs/dev/**", "modules/**"]
  workflow_dispatch:
    inputs:
      accion:
        description: "apply o destroy"
        required: true
        default: "apply"

permissions:
  id-token: write        # necesario para OIDC
  contents: read
  pull-requests: write   # para comentar el plan en el PR

env:
  TF_DIR: envs/dev
  AWS_REGION: us-east-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales AWS (OIDC, sin llaves permanentes)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform -chdir=$TF_DIR init -input=false

      - name: Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Escaneo de seguridad (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false

      - name: Plan
        id: plan
        run: terraform -chdir=$TF_DIR plan -input=false -no-color -out=plan.tfplan

      - name: Publicar plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65000)
            });

      - name: Apply (solo en main)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.accion == 'apply')
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve plan.tfplan

      - name: Destroy (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'destroy'
        run: terraform -chdir=$TF_DIR destroy -input=false -auto-approve
